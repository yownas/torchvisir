[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchvisir"
version = "0.0.3"
description = "Detect GPUs and install the matching PyTorch build"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
authors = [{ name = "Jonas Stare", email = "yownas@google.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yownas/torchvisir"

[tool.setuptools]
packages = ["torchvisir"]

[tool.setuptools.package-data]
torchvisir = ["tvdb/*.json"]
